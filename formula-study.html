<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c2e">
  <title>CFA Cards — Formula study</title>
  <style>
    :root { color-scheme: light; --ink:#17243a; --muted:#758198; --line:#e4e9f0; --bg:#f4f6fa; --accent:#4376f6; --nav:#101c2e; font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); }
    button,select { font:inherit; } button { cursor:pointer; }
    .topbar { height:68px; padding:0 max(20px,calc((100vw - 1060px)/2)); background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
    .topbar a { color:var(--ink); text-decoration:none; font-weight:700; }
    .topbar span { color:var(--muted); font-size:13px; }
    main { max-width:1060px; margin:auto; padding:38px 22px 70px; }
    .heading { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; }
    h1 { margin:0 0 6px; font-size:28px; letter-spacing:-.03em; } .heading p { color:var(--muted); margin:0; }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:18px; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:13px; box-shadow:0 18px 55px rgba(30,45,69,.08); padding:22px; }
    .study-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; } .study-head h2, aside h2 { font-size:15px; margin:0; }
    .counter { color:var(--muted); font-size:12px; }
    .flashcard { min-height:330px; border:1px solid var(--line); border-radius:12px; background:linear-gradient(145deg,#fff,#fbfcff); display:flex; flex-direction:column; cursor:pointer; }
    .card-top { display:flex; justify-content:space-between; padding:18px 20px 0; }
    .chip { background:#eef2ff; color:#455fba; border-radius:999px; padding:5px 10px; font-size:11px; font-weight:700; }
    .state { color:#99a3b4; font-size:11px; font-weight:700; letter-spacing:.08em; }
    .card-content { flex:1; display:grid; place-items:center; padding:30px 45px; text-align:center; font-size:21px; line-height:1.5; font-weight:600; white-space:pre-wrap; overflow-wrap:anywhere; }
    .card-content.answer { font-size:17px; font-weight:500; }
    .controls { display:flex; flex-wrap:wrap; gap:8px; margin-top:15px; }
    .btn { border:1px solid var(--line); border-radius:8px; background:white; color:var(--ink); padding:8px 12px; font-size:13px; font-weight:600; }
    .btn.primary { color:#fff; background:var(--accent); border-color:var(--accent); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .progress { height:4px; background:#edf0f5; border-radius:9px; overflow:hidden; margin-top:18px; }
    .progress span { display:block; height:100%; background:var(--accent); transition:width .2s; }
    aside { height:max-content; } aside h2 { margin-bottom:13px; }
    #topicList { display:grid; gap:3px; }
    .topic { width:100%; border:0; border-radius:7px; background:transparent; color:#536075; padding:9px 7px; display:flex; justify-content:space-between; text-align:left; font-size:13px; }
    .topic:hover,.topic.selected { background:#f2f5fb; color:var(--ink); }
    .count { color:#929db0; }
    .empty { color:var(--muted); text-align:center; padding:32px 18px; border:1px dashed #d6deea; border-radius:10px; }
    @media(max-width:760px) { .layout { grid-template-columns:1fr; } aside { order:-1; } #topicList { grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); } }
    @media(max-width:520px) { main { padding:26px 14px 40px; } .heading { display:block; } .heading h1 { font-size:24px; } .panel { padding:15px; } .flashcard { min-height:290px; } .card-content { padding:25px 20px; font-size:18px; } .card-content.answer { font-size:16px; } }
  </style>
</head>
<body>
  <header class="topbar"><a href="index.html">← CFA Cards</a><span>Formula study session</span></header>
  <main>
    <div class="heading"><div><h1>Formula deck</h1><p>Study every active formula together, or focus on a topic. Your existing formula cards are used automatically.</p></div></div>
    <div class="layout">
      <section class="panel">
        <div class="study-head"><h2>Flashcards</h2><span class="counter" id="counter">Loading…</span></div>
        <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="Flashcard. Press space or enter to reveal the answer">
          <div class="card-top"><span class="chip" id="cardTopic">Formula</span><span class="state" id="cardState">QUESTION</span></div>
          <div class="card-content" id="cardContent"></div>
        </div>
        <div class="controls">
          <button class="btn" id="previous">← Previous</button><button class="btn primary" id="flip">Show answer</button><button class="btn" id="next">Next →</button><button class="btn" id="shuffle">⤨ Shuffle</button>
        </div>
        <div class="progress"><span id="progressFill" style="width:0"></span></div>
      </section>
      <aside class="panel"><h2>Study by topic</h2><div id="topicList"></div></aside>
    </div>
  </main>
  <script>
    (() => {
      'use strict';
      const STORAGE_KEY = 'cfa-flashcards-v1';
      let formulas = [];
      let topic = 'all';
      let session = [];
      let index = 0;
      let revealed = false;
      const $ = (id) => document.getElementById(id);
      const activeFormulas = () => formulas.filter((card) => !card.archived && (topic === 'all' || card.topic === topic));
      function load() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          formulas = Array.isArray(parsed) ? parsed.filter((card) => card && card.isFormula && !card.archived && typeof card.front === 'string' && typeof card.back === 'string') : [];
        } catch { formulas = []; }
        renderTopics();
        reset();
      }
      function reset() { session = activeFormulas().map((card) => card.id); index = 0; revealed = false; render(); }
      function renderTopics() {
        const topics = [...new Set(formulas.map((card) => card.topic || 'General'))].sort((a,b) => a.localeCompare(b));
        const choices = [{ name:'All formulas', value:'all', count:formulas.length }, ...topics.map((name) => ({ name, value:name, count:formulas.filter((card) => (card.topic || 'General') === name).length }))];
        $('topicList').innerHTML = choices.map((item) => `<button class="topic ${topic === item.value ? 'selected' : ''}" data-topic="${escapeHtml(item.value)}"><span>${escapeHtml(item.name)}</span><span class="count">${item.count}</span></button>`).join('') || '<div class="empty">Add formula cards in the Formula deck to study here.</div>';
      }
      function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[char])); }
      function render() {
        const cards = activeFormulas();
        const card = cards.find((item) => item.id === session[index]);
        $('counter').textContent = card ? `${index + 1} of ${session.length}` : 'No formulas';
        $('cardTopic').textContent = card ? (card.topic || 'General') : 'Formula';
        $('cardState').textContent = card ? (revealed ? 'ANSWER' : 'QUESTION') : 'READY';
        $('cardContent').textContent = card ? (revealed ? card.back : card.front) : (formulas.length ? 'No formulas in this topic yet.' : 'Add formula cards in the Formula deck to start studying.');
        $('cardContent').classList.toggle('answer', !!card && revealed);
        $('flip').disabled = !card;
        $('previous').disabled = !card || session.length < 2;
        $('next').disabled = !card || session.length < 2;
        $('progressFill').style.width = card ? `${((index + 1) / session.length) * 100}%` : '0%';
        $('flip').textContent = revealed ? 'Show question' : 'Show answer';
      }
      function flip() { if (!session.length) return; revealed = !revealed; render(); }
      $('topicList').addEventListener('click', (event) => { const button = event.target.closest('[data-topic]'); if (!button) return; topic = button.dataset.topic; renderTopics(); reset(); });
      $('flashcard').addEventListener('click', flip);
      $('flashcard').addEventListener('keydown', (event) => { if (event.key === ' ' || event.key === 'Enter') { event.preventDefault(); flip(); } });
      $('flip').onclick = flip;
      $('previous').onclick = () => { if (!session.length) return; index = (index - 1 + session.length) % session.length; revealed = false; render(); };
      $('next').onclick = () => { if (!session.length) return; index = (index + 1) % session.length; revealed = false; render(); };
      $('shuffle').onclick = () => { session.sort(() => Math.random() - .5); index = 0; revealed = false; render(); };
      document.addEventListener('keydown', (event) => { if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return; if (event.key === 'ArrowRight') $('next').click(); if (event.key === 'ArrowLeft') $('previous').click(); if (event.code === 'Space') { event.preventDefault(); flip(); } });
      window.addEventListener('storage', load);
      load();
    })();
  </script>
</body>
</html>
